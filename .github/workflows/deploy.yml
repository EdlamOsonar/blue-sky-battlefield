name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Install Python dependencies
        run: |
          pip install pygame==2.5.2 pygbag==0.9.2

      - name: Build web version with pygbag
        run: |
          cd BlueSkyBattlefield
          python -m pygbag --build --app_name "Blue Sky Battlefield" .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BlueSkyBattlefield/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
